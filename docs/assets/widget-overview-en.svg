<svg xmlns="http://www.w3.org/2000/svg" lang="en" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">NutriFit widget integration overview</title>
  <desc id="desc">49 hosted calculators for nutrition, fitness, laboratory values and questionnaires. Embed them using React, JavaScript or an iframe. Six languages, light and dark themes, customizable colors and PDF reports.</desc>
  <rect width="1000" height="280" rx="24" fill="#f3f7f4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="47" font-size="25" font-weight="700" fill="#16382b">49 calculators. Your website.</text>
    <text x="36" y="75" font-size="15" fill="#4c6558">React · JavaScript · iframe</text>
    <rect x="36" y="98" width="294" height="108" rx="16" fill="#ffffff" stroke="#d6e3d9"/>
    <rect x="353" y="98" width="294" height="108" rx="16" fill="#ffffff" stroke="#d6e3d9"/>
    <rect x="670" y="98" width="294" height="108" rx="16" fill="#16382b"/>
    <g font-size="18" font-weight="700">
      <text x="56" y="130" fill="#16382b">Nutrition &amp; fitness</text>
      <text x="373" y="130" fill="#16382b">Laboratory calculators</text>
      <text x="690" y="130" fill="#ffffff">Lifestyle &amp; questionnaires</text>
    </g>
    <g font-size="14">
      <text x="56" y="160" fill="#4c6558">TDEE · Macros · Water · Body fat</text>
      <text x="56" y="183" fill="#4c6558">Protein · Fiber · 1RM · Heart rate</text>
      <text x="373" y="160" fill="#4c6558">HOMA-IR · eGFR · HbA1c · Lipids</text>
      <text x="373" y="183" fill="#4c6558">Methods, sources and limitations</text>
      <text x="690" y="160" fill="#d4e7da">Sleep · Caffeine · Eating behavior</text>
      <text x="690" y="183" fill="#d4e7da">DEBQ · PHQ-9 · GAD-7 · PSS-10</text>
    </g>
    <text x="36" y="247" font-size="14" fill="#16382b">6 languages · Light / dark themes · Custom colors · Branded PDF reports</text>
  </g>
</svg>
