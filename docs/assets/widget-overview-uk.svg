<svg xmlns="http://www.w3.org/2000/svg" lang="uk" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Вбудовані віджети NutriFit</title>
  <desc id="desc">49 калькуляторів харчування, фітнесу, лабораторних показників та опитувальників. Вбудовування через React, JavaScript або iframe. Шість мов, світла й темна теми, налаштування кольорів і звіти PDF.</desc>
  <rect width="1000" height="280" rx="24" fill="#f3f7f4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="47" font-size="25" font-weight="700" fill="#16382b">49 калькуляторів для вашого сайту.</text>
    <text x="36" y="75" font-size="15" fill="#4c6558">React · JavaScript · iframe</text>
    <rect x="36" y="98" width="294" height="108" rx="16" fill="#ffffff" stroke="#d6e3d9"/>
    <rect x="353" y="98" width="294" height="108" rx="16" fill="#ffffff" stroke="#d6e3d9"/>
    <rect x="670" y="98" width="294" height="108" rx="16" fill="#16382b"/>
    <g font-size="18" font-weight="700">
      <text x="56" y="130" fill="#16382b">Харчування та фітнес</text>
      <text x="373" y="130" fill="#16382b">Лабораторні розрахунки</text>
      <text x="690" y="130" fill="#ffffff">Звички й опитувальники</text>
    </g>
    <g font-size="14">
      <text x="56" y="160" fill="#4c6558">TDEE · БЖВ · Вода · Жир тіла</text>
      <text x="56" y="183" fill="#4c6558">Білок · Клітковина · 1RM · Пульс</text>
      <text x="373" y="160" fill="#4c6558">HOMA-IR · eGFR · HbA1c · Ліпіди</text>
      <text x="373" y="183" fill="#4c6558">Методи, джерела, обмеження</text>
      <text x="690" y="160" fill="#d4e7da">Сон · Кофеїн · Харчова поведінка</text>
      <text x="690" y="183" fill="#d4e7da">DEBQ · PHQ-9 · GAD-7 · PSS-10</text>
    </g>
    <text x="36" y="247" font-size="14" fill="#16382b">6 мов · Світла й темна теми · Ваші кольори · PDF з логотипом NutriFit</text>
  </g>
</svg>
