<svg xmlns="http://www.w3.org/2000/svg" lang="ru" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Встраиваемые виджеты NutriFit</title>
  <desc id="desc">49 калькуляторов питания, фитнеса, лабораторных показателей и опросников. Встраивание через React, JavaScript или iframe. Шесть языков, светлая и тёмная темы, настройка цветов и отчёты PDF.</desc>
  <rect width="1000" height="280" rx="24" fill="#f3f7f4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="47" font-size="25" font-weight="700" fill="#16382b">49 калькуляторов для вашего сайта.</text>
    <text x="36" y="75" font-size="15" fill="#4c6558">React · JavaScript · iframe</text>
    <rect x="36" y="98" width="294" height="108" rx="16" fill="#ffffff" stroke="#d6e3d9"/>
    <rect x="353" y="98" width="294" height="108" rx="16" fill="#ffffff" stroke="#d6e3d9"/>
    <rect x="670" y="98" width="294" height="108" rx="16" fill="#16382b"/>
    <g font-size="18" font-weight="700">
      <text x="56" y="130" fill="#16382b">Питание и фитнес</text>
      <text x="373" y="130" fill="#16382b">Лабораторные расчёты</text>
      <text x="690" y="130" fill="#ffffff">Привычки и опросники</text>
    </g>
    <g font-size="14">
      <text x="56" y="160" fill="#4c6558">TDEE · БЖУ · Вода · Жир тела</text>
      <text x="56" y="183" fill="#4c6558">Белок · Клетчатка · 1RM · Пульс</text>
      <text x="373" y="160" fill="#4c6558">HOMA-IR · eGFR · HbA1c · Липиды</text>
      <text x="373" y="183" fill="#4c6558">Методы, источники, ограничения</text>
      <text x="690" y="160" fill="#d4e7da">Сон · Кофеин · Пищевое поведение</text>
      <text x="690" y="183" fill="#d4e7da">DEBQ · PHQ-9 · GAD-7 · PSS-10</text>
    </g>
    <text x="36" y="247" font-size="14" fill="#16382b">6 языков · Светлая и тёмная темы · Ваши цвета · PDF с логотипом NutriFit</text>
  </g>
</svg>
