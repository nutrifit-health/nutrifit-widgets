<svg xmlns="http://www.w3.org/2000/svg" lang="kk" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">NutriFit ендірілетін виджеттері</title>
  <desc id="desc">Тамақтану, фитнес, зертханалық көрсеткіштер мен сауалнамаларға арналған 49 калькулятор. React, JavaScript немесе iframe арқылы ендіру. Алты тіл, ашық және қараңғы тақырыптар, түстерді баптау және PDF есептері.</desc>
  <rect width="1000" height="280" rx="24" fill="#f3f7f4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="47" font-size="25" font-weight="700" fill="#16382b">Сайтыңызға арналған 49 калькулятор.</text>
    <text x="36" y="75" font-size="15" fill="#4c6558">React · JavaScript · iframe</text>
    <rect x="36" y="98" width="294" height="108" rx="16" fill="#ffffff" stroke="#d6e3d9"/>
    <rect x="353" y="98" width="294" height="108" rx="16" fill="#ffffff" stroke="#d6e3d9"/>
    <rect x="670" y="98" width="294" height="108" rx="16" fill="#16382b"/>
    <g font-size="18" font-weight="700">
      <text x="56" y="130" fill="#16382b">Тамақтану және фитнес</text>
      <text x="373" y="130" fill="#16382b">Зертханалық есептеулер</text>
      <text x="690" y="130" fill="#ffffff">Әдеттер мен сауалнамалар</text>
    </g>
    <g font-size="13">
      <text x="56" y="160" fill="#4c6558">TDEE · БЖК · Су · Дене майы</text>
      <text x="56" y="183" fill="#4c6558">Ақуыз · Талшық · 1RM · Тамыр соғысы</text>
      <text x="373" y="160" fill="#4c6558">HOMA-IR · eGFR · HbA1c · Липидтер</text>
      <text x="373" y="183" fill="#4c6558">Әдістер, дереккөздер, шектеулер</text>
      <text x="690" y="160" fill="#d4e7da">Ұйқы · Кофеин · Тамақтану мінез-құлқы</text>
      <text x="690" y="183" fill="#d4e7da">DEBQ · PHQ-9 · GAD-7 · PSS-10</text>
    </g>
    <text x="36" y="247" font-size="14" fill="#16382b">6 тіл · Ашық және қараңғы тақырыптар · Өз түстеріңіз · NutriFit логотипі бар PDF</text>
  </g>
</svg>
